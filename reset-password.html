<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reset password | Bethuel Sang Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0B1120;color:#F1F5F9;font:16px/1.6 Inter,system-ui,sans-serif}
.card{width:min(100%,440px);padding:28px;background:#1E293B;border:1px solid #334155;border-radius:18px}
h1{font:700 1.7rem 'Space Grotesk',sans-serif;margin:0 0 8px}p{color:#94A3B8}
label{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;padding:12px;border:1px solid #334155;border-radius:8px;background:#0B1120;color:#F1F5F9;font:inherit}
button{margin-top:18px;padding:11px 16px;border:0;border-radius:8px;background:#06B6D4;color:#0B1120;font:600 1rem Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}a{color:#06B6D4}#status{margin-top:16px;min-height:24px;color:#A7F3D0}#status.error{color:#FCA5A5}
</style>
</head>
<body>
<main class="card">
 <h1>Choose a new password</h1>
 <p>Enter and confirm your new portfolio admin password.</p>
 <form id="resetForm" hidden>
  <label for="password">New password</label>
  <input id="password" type="password" autocomplete="new-password" minlength="8" required>
  <label for="confirm">Confirm new password</label>
  <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
  <button id="save" type="submit">Update password</button>
 </form>
 <p id="status" role="status" aria-live="polite">Checking your secure reset link…</p>
 <p><a href="/#admin">Return to admin sign in</a></p>
</main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function(){
 const status=document.getElementById("status"),form=document.getElementById("resetForm"),save=document.getElementById("save");
 const say=(message,error=false)=>{status.textContent=message;status.className=error?"error":""};
 const config=window.PORTFOLIO_CONFIG||{};
 if(!config.url||!config.key||!window.supabase){say("The password reset service could not start. Please contact the site administrator.",true);return}
 const client=window.supabase.createClient(config.url,config.key);
 try{
  const {data:{session},error}=await client.auth.getSession();
  if(error)throw error;
  if(!session){say("This reset link is invalid, expired, or has already been used. Return to admin sign in and request a new link.",true);return}
  form.hidden=false;say("Your reset link is valid. Choose a new password of at least 8 characters.");
 }catch(error){say(error.message||"Could not verify the reset link. Request a new one.",true);return}
 form.addEventListener("submit",async function(event){
  event.preventDefault();
  const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
  if(password.length<8){say("Use at least 8 characters for your password.",true);return}
  if(password!==confirm){say("The passwords do not match.",true);return}
  save.disabled=true;save.textContent="Updating…";
  try{
   const {error}=await client.auth.updateUser({password});
   if(error)throw error;
   say("Your password has been updated. You can now sign in to the admin dashboard.");
   form.hidden=true;
   await client.auth.signOut();
  }catch(error){say(error.message||"Password update failed. Request a new reset link.",true)}
  finally{save.disabled=false;save.textContent="Update password"}
 });
})();
</script>
</body>
</html>
