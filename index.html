<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bethuel Sang | Business & Data Analyst</title>
<meta name="description" content="Business and data analyst in trade development and market intelligence, East African Tea Trade Association (EATTA), Mombasa.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2D3D;--muted:#5F6F81;--leaf:#1B3A57;--leaf-d:#102A43;--brass:#0F766E;--paper:#F4F7FB;--card:#fff;--line:#DDE5EE;--serif:"Fraunces",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:1rem}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
a{color:var(--leaf-d)}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1180px;margin:0 auto}
aside{position:sticky;top:0;height:100vh;padding:2.2rem 1.4rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1.4rem}
aside .brand{font:700 1.35rem/1.15 var(--serif);color:var(--leaf-d);text-decoration:none}
aside nav{display:flex;flex-direction:column;gap:.15rem}
aside nav a{padding:.45rem .7rem;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
aside nav a:hover,aside nav a.on{background:#E6EEF6;color:var(--leaf-d)}
aside .side-cta{margin-top:auto;font-size:.9rem;color:var(--muted)}
main{padding:2.4rem clamp(1rem,4vw,3rem) 4rem}
section{padding:2.6rem 0 .4rem}
h2{font:700 clamp(1.6rem,3vw,2.2rem)/1.15 var(--serif);margin:0 0 1.2rem;color:var(--leaf-d)}
h3{font:600 1.1rem/1.3 var(--serif);margin:0 0 .3rem}
.muted{color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 190px;gap:2rem;align-items:center;padding-top:.4rem}
.hero img{width:190px;height:190px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 24px rgba(16,42,67,.18)}
.hero h1{font:700 clamp(2.6rem,6vw,4.4rem)/1 var(--serif);letter-spacing:-.03em;margin:0 0 .6rem;color:var(--leaf-d)}
.hero .lead{font:600 clamp(1.15rem,2.2vw,1.5rem)/1.3 var(--serif);margin:0 0 .9rem;max-width:34ch}
.hero p{max-width:62ch;margin:.2rem 0 1rem}
.btns{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-block;padding:.6rem 1.1rem;border-radius:8px;border:1px solid var(--leaf);background:var(--leaf);color:#fff;text-decoration:none;font-weight:600}
.btn.alt{background:transparent;color:var(--leaf-d)}.btn:hover{background:var(--leaf-d);color:#fff}
dl.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:2rem 0 0;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
dl.facts div{padding:.9rem 1rem;border-right:1px solid var(--line)}dl.facts div:last-child{border:0}
dl.facts dt{font-size:.82rem;color:var(--brass);font-weight:600}dl.facts dd{margin:.15rem 0 0;font-weight:600;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
.card .cat{font-size:.82rem;color:var(--brass);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:.35rem;margin:.7rem 0}
.pill{font-size:.78rem;padding:.12rem .55rem;border:1px solid var(--line);border-radius:99px;background:#EDF2F8;color:var(--muted)}
details{margin-top:.6rem}summary{cursor:pointer;font-weight:600;color:var(--leaf-d)}
details p{margin:.5rem 0 0;font-size:.94rem}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.filters button{font:inherit;font-size:.9rem;padding:.3rem .8rem;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer}
.filters button.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.timeline{border-left:2px solid var(--line);margin-left:.4rem;padding-left:1.4rem}
.job{position:relative;padding-bottom:1.6rem}
.job::before{content:"";position:absolute;left:-1.9rem;top:.45rem;width:.7rem;height:.7rem;border-radius:50%;background:var(--brass)}
.job .when{font-size:.88rem;color:var(--muted)}
.job ul{margin:.5rem 0 0;padding-left:1.1rem}.job li{margin:.2rem 0;font-size:.95rem}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.skills p{margin:.3rem 0 0;font-size:.95rem}
.cert .iss{font-size:.84rem;color:var(--muted)}.cert a{font-size:.9rem;font-weight:600}
.more li{margin:.5rem 0}
.contact a{font-weight:600}
footer{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}

/* Admin (same page, shown at #admin) */
#adminView{display:none}body.admin-mode #adminView{display:block}
body.admin-mode main>section,body.admin-mode main>footer{display:none}
#adminView .hide{display:none!important}
#adminView .ahead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
#adminView .card{margin-bottom:1rem}
#adminView label{display:block;font-weight:600;font-size:.9rem;margin:.7rem 0 .2rem}
#adminView input,#adminView select,#adminView textarea{width:100%;font:inherit;padding:.5rem .6rem;border:1px solid #C3CFDC;border-radius:8px;background:#fff;color:var(--ink)}
#adminView textarea{min-height:90px;resize:vertical}#adminView input[type=checkbox]{width:auto;margin-right:.4rem}
#adminView button{font:inherit;font-weight:600;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--leaf);background:var(--leaf);color:#fff;cursor:pointer}
#adminView button.alt{background:#fff;color:var(--leaf-d)}#adminView button.del{background:#fff;color:#B42318;border-color:#B42318}
#adminView button.sm{padding:.25rem .55rem;font-size:.85rem}#adminView button:disabled{opacity:.4;cursor:default}
#adminView input:focus-visible,#adminView select:focus-visible,#adminView textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#adminView .tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
#adminView .tabs button{background:#fff;color:var(--leaf-d);border-color:var(--line)}#adminView .tabs button.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
#adminView .row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--line)}#adminView .row:last-child{border:0}
#adminView .row .t{font-weight:600}#adminView .row .s{font-size:.85rem;color:var(--muted)}#adminView .acts{display:flex;gap:.35rem;flex-shrink:0}
#adminView #msg{position:sticky;top:3.4rem;z-index:5;padding:.6rem .9rem;border-radius:8px;margin-bottom:1rem;display:none;font-weight:600}
#adminView #msg.ok{display:block;background:#E3F3EA;color:#145A32}#adminView #msg.err{display:block;background:#FDE7E4;color:#B42318}
/* Text alignment */
main p,main li{text-align:justify;text-justify:inter-word;hyphens:auto;-webkit-hyphens:auto}
.hero .lead,.facts dd,.facts dt,.contact p,.btns,.filters,#adminView p,#adminView li,#adminView .s,#adminView .t{text-align:left;hyphens:none;-webkit-hyphens:none}
@media(max-width:600px){main p,main li{text-align:left;hyphens:none}}
/* Centered hero: picture first */
.hero{display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center;padding-top:.4rem}
.hero>div{display:flex;flex-direction:column;align-items:center}
.hero img{order:-1;width:190px;height:190px}
.hero h1{margin-bottom:.5rem}
.hero .lead{margin:0 auto .9rem;max-width:48ch;text-align:center;hyphens:none}
.hero p{max-width:64ch;margin:.2rem auto 1.1rem;text-align:center;hyphens:none}
.hero .btns{justify-content:center}
.facts dd a{text-decoration:none}.facts dd a:hover{text-decoration:underline}
.hero .role{font:600 clamp(1.05rem,2.2vw,1.3rem)/1.3 var(--serif);color:var(--brass);margin:0 0 .4rem}
.hero .meta{color:var(--muted);font-size:.95rem;margin:0 0 1rem}
.known{padding-left:1.1rem;margin:.4rem 0}.known li{margin:.35rem 0}
.tag{font-style:italic;color:var(--leaf);margin:.1rem 0}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2rem;width:100%}
.dim{border-top:4px solid var(--brass)}.dim.two{border-top-color:var(--leaf)}
.dim p,.dim li{text-align:left;hyphens:none}.dim ul{padding-left:1.1rem;margin:.5rem 0 .8rem}.dim li{margin:.3rem 0}.dim a{font-weight:600}
.shot{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-bottom:.8rem;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.5rem;margin-top:.6rem}.gal img{width:100%;border-radius:6px;border:1px solid var(--line);display:block}
#adminView .shots{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.4rem}
#adminView .shots label{font-weight:400;width:110px;font-size:.8rem;margin:0}
#adminView .shots img{width:110px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block}
@media(max-width:700px){.dims{grid-template-columns:1fr}}
#home{padding:2rem clamp(1rem,4vw,2.5rem) 2rem!important;border-radius:18px;background:linear-gradient(135deg,#102A43,#0F5E63);background-size:cover;background-position:center}
#home .hero h1,#home .hero .lead,#home .hero .meta,#home .hero .meta a{color:#fff}
#home .hero .role{color:#9FE3DA}
#home .hero img{border-color:#fff}
#home .btn{background:#fff;color:var(--leaf-d);border-color:#fff}
#home .btn.alt{background:transparent;color:#fff;border-color:rgba(255,255,255,.75)}
#home .btn:hover{background:#E6EEF6;color:var(--leaf-d)}#home .btn.alt:hover{background:rgba(255,255,255,.16);color:#fff}

/* Enhanced readability shadows and contrast for home banner */
#home .hero h1,
#home .hero .lead,
#home .hero p,
#home .hero .role,
#home .hero .meta {
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}

.list-roman .known,.list-roman .dim ul,.list-roman .job ul{list-style:lower-roman;padding-left:2.1rem}
.list-roman .known li,.list-roman .dim li,.list-roman .job li{padding-left:.3rem;margin:.4rem 0}
.list-roman li::marker{color:var(--brass);font-weight:700}
.nobullets .known,.nobullets .dim ul,.nobullets .job ul{list-style:none;padding-left:0}
.nobullets .known li,.nobullets .dim li,.nobullets .job li{padding:.45rem 0;margin:0;border-bottom:1px solid var(--line)}
.nobullets .known li:last-child,.nobullets .dim li:last-child,.nobullets .job li:last-child{border-bottom:0}
#home{position:relative;overflow:hidden}
#home>.hero,#home>.dims{position:relative;z-index:1}
